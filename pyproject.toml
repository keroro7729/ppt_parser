[tool.poetry]
name = "ppt-parser"
version = "0.1.0"
description = "parse ppt with local ollama"
authors = ["keroro7729 <keroro06108@gmail.com>"]
readme = "README.md"
packages = [{ include = "ppt_parser", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11"
python-pptx = "^0.6.21"
pandas = "^2.3.3"
requests = "^2.32.5"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

